name: 问题报告
description: 报告可以复现的 AA农场问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请勿上传私有代码、API Key、个人路径或其他敏感信息。"
  - type: input
    id: version
    attributes:
      label: AA农场版本
      description: 如果应用打不开或找不到版本号，可以填写“不清楚”。
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac 芯片
      options: [Apple Silicon, Intel, 不清楚]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      description: 可在苹果菜单 → 关于本机中查看；找不到时可填“不清楚”。
      placeholder: 例如 macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: 使用的 AI 农夫
      options: [Codex（ChatGPT 登录）, Ollama（本地模型）, 其他兼容模型, 尚未运行任务, 不清楚]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，按顺序写出操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的截图或日志
      description: 可选。上传前请遮住仓库名、用户名、代码和凭证。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交私有代码、API Key 或其他敏感数据。
          required: true
